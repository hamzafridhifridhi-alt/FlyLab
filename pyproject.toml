[project]
name = "flylab"
version = "0.1.0"
description = "Live whole-brain Drosophila connectome simulation with an embodied fly and a web UI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "brian2>=2.10.1",
    "fastapi>=0.115",
    "flygym>=2.1.0",
    "imageio>=2.37.4",
    "mediapy>=1.2.7",
    "mujoco>=3.9,<3.10",
    "numba>=0.67.0",
    "numpy>=2.1",
    "orjson>=3.10",
    "pandas>=2.2",
    "pillow>=12.3.0",
    "pyarrow>=18",
    "scipy>=1.15",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.34",
    "websockets>=14",
]

[project.scripts]
flylab = "flylab.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
